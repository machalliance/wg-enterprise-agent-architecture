name: Daily News Scan

on:
  schedule:
    # Runs at 9:00 AM UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to watcher config (relative to repo root)'
        required: false
        default: 'config/ai-structured-content.json'
      lookback_hours:
        description: 'Hours to look back for articles'
        required: false
        default: '24'
      save_as_github_issue:
        description: 'Save digest as a GitHub Issue (true/false)'
        required: false
        default: 'false'
      research_mode:
        description: 'Enable Research Mode to catalog claims (true/false)'
        required: false
        default: 'false'
      ai_provider:
        description: 'AI provider to use (anthropic, openai, or vercel)'
        required: false
        default: 'anthropic'

permissions:
  contents: write   # needed to commit research state and create issues
  issues: write     # needed to create GitHub Issues

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can push the research state commit back
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news watcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: ${{ github.event.inputs.config_path || 'config/ai-structured-content.json' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          SAVE_AS_GITHUB_ISSUE: ${{ github.event.inputs.save_as_github_issue || 'false' }}
          RESEARCH_MODE: ${{ github.event.inputs.research_mode || 'false' }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'anthropic' }}
        run: python src/watcher.py

      # Runs on every job, not only when the research_mode dispatch input is set,
      # because Research Mode can also be enabled from the config file. The step
      # is a no-op when nothing under research/ changed.
      - name: Commit research state
        run: |
          set -x
          if [ ! -d research ]; then
            echo "No research/ directory produced; nothing to commit."
            exit 0
          fi
          ls -la research/
          git status --short research/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/
          if git diff --staged --quiet; then
            echo "Research state unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update research state [skip ci]"
          # Push to the branch this run was dispatched from. If the branch moved
          # while the run was in progress, rebase onto it and push again.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected; rebasing onto latest origin/${GITHUB_REF_NAME} and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git log -1 --oneline
