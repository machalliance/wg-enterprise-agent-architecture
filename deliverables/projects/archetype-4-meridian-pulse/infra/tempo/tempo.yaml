# =============================================================================
# Tempo config — Meridian Pulse (M6)
#
# Single-binary Tempo with local (filesystem) storage — fine for a demo. Receives
# traces over OTLP gRPC on 4317. Only the OTel Collector talks to Tempo, and it
# does so over the internal compose network (tempo:4317), so Tempo's 4317 is NOT
# published to the host and does not clash with the collector's published 4317.
#
# Tempo HTTP API / query frontend is on 3200 (the Grafana Tempo datasource URL).
# =============================================================================

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush quickly so traces show up fast during a live demo.
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
