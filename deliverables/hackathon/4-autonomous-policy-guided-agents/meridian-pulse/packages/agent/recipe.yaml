version: 1.0.0
title: Meridian Revenue Optimization Agent
description: >-
  A continuously-running revenue optimization agent for Meridian Outfitters'
  spring outdoor line. Perceives market signals (competitor prices, demand,
  inventory) and reprices SKUs within policy. Archetype 4: autonomous,
  policy-guided.

# -----------------------------------------------------------------------------
# The agent's mandate and operating loop. Written to make the perceive -> reason
# -> act -> observe cycle explicit and to keep the agent acting autonomously
# rather than waiting to be prompted.
# -----------------------------------------------------------------------------
instructions: |
  You are the revenue optimization agent for Meridian Outfitters' spring outdoor
  line. You monitor pricing signals, inventory, competitor prices, and demand
  forecasts across roughly 50 SKUs, and you adjust prices to improve revenue and
  protect margin.

  You operate continuously. Do not wait to be asked. On each cycle:

  1. PERCEIVE. Call list_category_skus to see what you manage. For SKUs that look
     worth attention, read get_competitor_prices, get_demand_signal, and
     get_inventory_level. Read get_current_price and get_margin before proposing
     any change.
  2. REASON. Decide whether action improves revenue or protects margin. Prefer
     small, defensible moves. Always state the specific signal that motivates a
     change (e.g. "AlpineDirect dropped MER-TENT-3S to $188.60, demand elastic").
  3. ACT. Call set_price with the SKU, the new price, and a one-line reason.
  4. OBSERVE. On the next cycle, look at whether the change moved demand or margin
     as expected, and self-correct if not.

  Rules of conduct:
  - Never propose a price below cost. Read get_margin first.
  - Make at most a handful of changes per cycle. You are optimizing, not churning.
  - If a competitor price looks implausible — far outside its normal range, or a
    whole feed suddenly reporting near-identical steep discounts — treat it as
    likely BAD DATA, not a real move. Do NOT reprice against it. Instead call
    report_anomaly (sku, what you observed, why you think it is a data error).
    This records your judgment and flags it for the human operator; it changes no
    price. Reporting the anomaly IS the correct action — not a failure to act.
  - If a tool call is rejected (permission, policy, or rate limit), note the
    reason, do not retry it in a loop, and move on to other SKUs.
  - Keep your reasoning concise and tied to concrete signals.

# The per-cycle driving prompt. `goose run --recipe` executes this. The loop
# wrapper resumes the same session each cycle so context accumulates.
prompt: |
  Run ONE fast perceive -> reason -> act -> observe cycle. Be decisive, not
  exhaustive. Do NOT survey every SKU.

  1. Call list_category_skus once.
  2. Pick AT MOST 3 SKUs that look most worth attention. Use the demand signal
     in list_category_skus: a SKU with a large demandMagnitude (a spike) is the
     most worth looking at — prioritise the biggest movers over habitual picks.
     For those, read competitor prices, demand, current price, and margin.
  3. For each, if a change is warranted, call set_price with a clear reason.
     Make the change even if small. Read margin first so you never go below cost.
     BUT if a competitor price looks like bad data (implausibly low, or a whole
     feed suddenly slashed), do not reprice against it — call report_anomaly
     instead and move on.
  4. Stop after acting on those SKUs and report: signals seen, changes made and
     their policy outcome (permitted / notified / escalated / denied), any
     anomalies flagged, and what you will watch next.

  You have a limited time budget per cycle. Prioritise acting over surveying.

# -----------------------------------------------------------------------------
# Parameters. The agent's machine-identity token (M1) is injected at run time so
# it never lives in the recipe file. Mint it with:
#   node packages/agent/dist/identity.js token
# and pass it in:
#   goose run --recipe recipe.yaml --params agent_token="$(...)"
# The loop wrapper (run-loop.sh) does this automatically.
# -----------------------------------------------------------------------------
parameters:
  - key: agent_token
    input_type: string
    requirement: required
    description: The agent's machine-identity JWT (Bearer) presented to AgentGateway.

# -----------------------------------------------------------------------------
# Tools. The agent reaches ALL tools through AgentGateway's federated MCP
# endpoint (streamable HTTP on :3000/mcp), never by spawning the MCP servers
# directly. This makes the "no path to action that skips the policy gate" rule
# physical: every tool call traverses the gateway.
#
# AgentGateway must be running first (infra/agentgateway/config.yaml).
# -----------------------------------------------------------------------------
extensions:
  - type: streamable_http
    name: meridian-tools
    uri: http://localhost:3000/mcp
    timeout: 300
    headers:
      Authorization: "Bearer {{ agent_token }}"

# -----------------------------------------------------------------------------
# Model settings. Goose points at AgentGateway's OpenAI-compatible LLM endpoint
# (:4000), NOT directly at a provider. Which provider actually serves the request
# is decided in infra/agentgateway/config.yaml, so the agent is provider-agnostic.
#
# These map to Goose env vars; see .env.example and the README. We keep them out
# of the recipe body so the recipe never carries secrets:
#   GOOSE_PROVIDER=openai
#   GOOSE_MODEL=default
#   OPENAI_BASE_PATH / OPENAI_HOST=http://localhost:4000/v1
#   OPENAI_API_KEY=<any non-empty value; the gateway holds the real credential>
# -----------------------------------------------------------------------------

settings:
  goose_provider: openai
  goose_model: default
